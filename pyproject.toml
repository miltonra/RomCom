[project]
name = "RomCom"
version = "1.0.0"
description = "Reduced Order Modelling software, implementing Global Sensitivity Analysis using Gaussian Processes."
authors = [
    {name = "Robert A. Milton", email="r.a.milton@sheffield.ac.uk"}
]
license = { text = "GNU AGPL v3" }
readme = "README.md"
keywords = ["Reduced Order Modelling", "Global Sensitivity Analysis", "Gaussian Process", "Sobol ClosedSobol", "Screening"]
classifiers = ["Topic :: Scientific/Engineering :: Artificial Intelligence",
                "Intended Audience :: Science/Research", "Development Status :: 4 - Beta"]

dependencies = [
    "torch >= 2.12",
    "polars >= 1.40",
    "SALib >= 1.5",
]

[tool.setuptools.packages.find]
where = [""]
include = ["rc*"]  # alternatively: `exclude = ["additional*"]`
namespaces = false

[project.optional-dependencies ]
dev = [
    "Sphinx >= 9.1",
    "sphinx-argparse >= 0.5",
    "sphinx-copybutton >= 0.5",
    "sphinx-autoapi >= 3.8",
    "sphinx-autodoc-typehints >= 3.10",
    "sphinx_design >= 0.7",
    "pydata-sphinx-theme >= 0.18",
]

[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=70.2", "wheel"]
python = ">= 3.14"

[project.urls]
homepage = "https://github.com/miltonra/RomCom"
repository = "https://github.com/miltonra/RomCom"
documentation = "https://miltonra.github.io/RomCom/index.html"
